# CLA enforcement — contributor-assistant (lite CLA Assistant)
# Signatures: signatures/cla.json on master
# Document: https://docs.solved.gg/legal/2026-07-04/cla
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # contributor-assistant/github-action v2.6.1 (pinned to commit SHA)
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://docs.solved.gg/legal/2026-07-04/cla
          branch: master
          allowlist: dependabot[bot],renovate[bot],github-actions[bot],graphite-app[bot],linear[bot]
          create-file-commit-message: "chore(cla): create signature storage"
          signed-commit-message: "chore(cla): $contributorName signed the CLA"
          custom-notsigned-prcomment: >-
            Thank you for your contribution to iResolved / solved.gg.

            Before we can merge, you must accept the Contributor License Agreement (CLA)
            so we can maintain dual-class licensing (source-available + EULA/commercial).

            **CLA:** https://docs.solved.gg/legal/2026-07-04/cla

            Reply to this PR with exactly:

            `I have read the CLA Document and I hereby sign the CLA`

            Corporate contributors: also ensure a Corporate CLA is on file (intake@solved.gg).
            After signing, comment `recheck` if the check does not update.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
